worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;        # login attempts
  limit_req_zone $binary_remote_addr zone=admin_reset:10m rate=3r/m;  # admin forgot/reset
  limit_req_zone $binary_remote_addr zone=user_auth:10m rate=10r/m;   # user auth endpoints

  log_format audit '$remote_addr - [$time_local] '
                   '"$request_method $request_uri $server_protocol" $status $body_bytes_sent '
                   'rt=${request_time}s ua="$http_user_agent"';

  access_log /var/log/nginx/access.log audit;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location = /admin/login {
      auth_basic "Strapi Admin (Extra auth layer)";
      auth_basic_user_file /etc/nginx/.htpasswd;
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://app:1337;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/admin/(register-admin|forgot-password|reset-password)$ {
      auth_basic "Strapi Admin (Extra auth layer)";
      auth_basic_user_file /etc/nginx/.htpasswd;
      limit_req zone=admin_reset burst=2 nodelay;
      proxy_pass http://app:1337;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/auth/(local|local/register|forgot-password|reset-password|change-password)$ {
      limit_req zone=user_auth burst=5 nodelay;
      proxy_pass http://app:1337;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://app:1337;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}